<!doctype html>
<html lang="pl">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#F5F8F2" />
		<meta name="application-name" content="1story" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="1story" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<!-- Keep under ~120 characters so Google's mobile SERP snippet is not truncated at 3 lines. -->
		<meta name="description" content="Twórz profesjonalne CV dopasowane do konkretnej oferty pracy na podstawie swojego profilu zawodowego.">

		<link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="16x16 32x32 48x48" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" type="image/png" sizes="180x180 any" />
		<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />

		<title>1story — CV dopasowane do oferty pracy</title>
	</head>
	<body>
		<!-- Keep #app empty: main.tsx only mounts React when rootElement has no children. -->
		<div id="app"></div>
		<!-- Branded first paint; hidden once React populates #app (higher-specificity rule below). -->
		<div id="initial-loader">
			<img class="initial-loader__brand" src="/logo/light.svg" alt="1story" />
			<div class="initial-loader__spinner"></div>
			<span class="initial-loader__sr-only">Ładowanie</span>
		</div>
		<style>
			@keyframes app-spin { to { transform: rotate(360deg) } }
			#initial-loader {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 24px;
				background: #F5F8F2;
			}
			#app:not(:empty) ~ #initial-loader { display: none; }
.initial-loader__brand {
display: block;
width: auto;
height: 48px;
}
.initial-loader__spinner {
				width: 24px;
				height: 24px;
				border: 2px solid rgba(78, 107, 53, 0.2);
				border-top-color: #4E6B35;
				border-radius: 9999px;
				animation: app-spin 0.7s linear infinite;
			}
			.initial-loader__sr-only {
				position: absolute;
				width: 1px;
				height: 1px;
				overflow: hidden;
				clip: rect(0 0 0 0);
			}
		</style>
		<script type="module" data-cfasync="false" src="/src/main.tsx"></script>
	</body>
</html>
